[project]
name = "ai-plot-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.19.1",
    "fastapi-error-map>=1.0.0",
    "langchain>=1.3.18",
    "openai>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-ai>=2.38.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "sqlalchemy[mypy]>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = []
